  // টেক্সট কন্ট্রোলারগুলো এখানে ডিক্লেয়ার করা থাকবে
  final TextEditingController _descController = TextEditingController();
  final TextEditingController _amountController = TextEditingController();
  DateTime _selectedDate = DateTime.now();

  // এন্ট্রি সেভ করার ফাংশন
  void _addTransaction(List<Map<String, String>> list, AppLocalizations loc) {
    if (_descController.text.isNotEmpty && _amountController.text.isNotEmpty) {
      setState(() {
        // লিস্টে নতুন লেনদেন যোগ হচ্ছে
        list.add({
          'desc': _descController.text,
          'amount': _amountController.text,
          'date': DateFormat('yyyy-MM-dd').format(_selectedDate),
        });
        
        // ইনপুট ফিল্ডগুলো খালি করে দেওয়া হচ্ছে
        _descController.clear();
        _amountController.clear();
      });
      
      // লোকাল স্টোরেজে ডেটা পার্মানেন্টলি সেভ করার কল (যদি থেকে থাকে)
      _saveDataToPrefs();
    } else {
      // যদি কোনো ঘর খালি থাকে, একটি ছোট মেসেজ দেখাতে পারেন
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(content: Text(loc.getTranslatedValue('msg_fill_fields') ?? 'সব ঘর পূরণ করুন')),
      );
    }
  }
